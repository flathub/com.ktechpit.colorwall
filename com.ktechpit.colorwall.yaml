app-id: com.ktechpit.colorwall
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: colorwall
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --device=dri
  - --env=INSTALL_TYPE=flatpak
  - --talk-name=org.freedesktop.FileManager1
  - --filesystem=xdg-run/gvfsd

cleanup:
  - /include
  - /lib/cmake
  - /share/man
  - /share/doc

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: libgumbo
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/google/gumbo-parser/archive/v0.10.1.tar.gz
        sha256: 28463053d44a5dfbc4b77bcf49c8cee119338ffa636cc17fc3378421d714efad
    cleanup:
      - /lib/pkgconfig
      - /include
      - '*.a'
      - '*.la'

  - name: colorwall
    buildsystem: simple
    build-commands:
      - unsquashfs -no-progress *.snap
      - install -Dm755 squashfs-root/usr/bin/colorwall ${FLATPAK_DEST}/bin/colorwall
      - cp -r squashfs-root/usr/share/icons ${FLATPAK_DEST}/share/
      - install -Dm644 squashfs-root/usr/share/applications/com.ktechpit.colorwall.desktop ${FLATPAK_DEST}/share/applications/com.ktechpit.colorwall.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.ktechpit.colorwall.desktop
      - install -Dm644 squashfs-root/usr/share/metainfo/com.ktechpit.colorwall.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.ktechpit.colorwall.metainfo.xml

    sources:
        # =========================
        # x86_64 – stable
        # =========================
        - type: file
          url: https://api.snapcraft.io/api/v1/snaps/download/tPiGTcpRYwWhmLFqKMefGzuC6isfwbci_40.snap
          sha256: 2707ff95786db93c210f7e4b400fe4c44d4f95e393a9505369da7beb956d88c6
          only-arches:
              - x86_64


        # =========================
        # aarch64 – stable
        # =========================
        - type: file
          url: https://api.snapcraft.io/api/v1/snaps/download/tPiGTcpRYwWhmLFqKMefGzuC6isfwbci_41.snap
          sha256: 9a3a290cc41928c96007dde6ec1c4982e6b0f84f45863ef93bea3f11615599bd
          only-arches:
              - aarch64
